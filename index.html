<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nic Bolton</title>
    <base href="/" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="/_content/MudBlazor/MudBlazor.min.css?v=1" rel="stylesheet" />

    <script type="text/javascript">
        // https://github.com/rafgraph/spa-github-pages
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&')
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        }(window.location))
    </script>
</head>

<body>
    <div id="app">
        <div class="gray darken-4 mud-full-width d-flex align-center justify-center" style="height: 100vh">
            <div class="d-flex align-center flex-column gap-3 pa-2" style="height: 300px; width: 100%;">
                <img src="/img/utoronto.png" alt="University of Toronto" height="100px">
                <img src="/img/boltoncup.png" alt="Bolton Cup" height="100px">
            </div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="/_content/MudBlazor/MudBlazor.min.js?v=1.0.0"></script>
</body>

</html>
