name: Publish to GH Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-to-github-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Publish site to the build branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: build
          folder: site
